services:
  osmanlica-cevirici:
    image: berzahbey/osmanlica-cevirici:latest
    container_name: osmanlica-cevirici-test
    restart: unless-stopped
    ports:
      - "8089:8000"
    environment:
      - OLLAMA_HOST=http://192.168.1.2:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_TIMEOUT=300
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - osmanlica_data_test:/data
      - osmanlica_app_data_test:/app/data

volumes:
  osmanlica_data_test:
  osmanlica_app_data_test:
