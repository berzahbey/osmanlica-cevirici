services:
  osmanlica-cevirici:
    build: .
    container_name: osmanlica-cevirici
    restart: unless-stopped
    ports:
      - "8088:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      # Sözlüğü kalıcı yapmak ve kolayca düzenleyebilmek için:
      - ./app/data/ottoman_dict.tsv:/app/data/ottoman_dict.tsv
